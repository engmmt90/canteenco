name: CanteenCo CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only. CI never points at production data.
      DATABASE_URL: postgresql://user:password@localhost:5432/canteenco?sslmode=disable
      DIRECT_URL: postgresql://user:password@localhost:5432/canteenco?sslmode=disable
      AUTH_SECRET: ci-only-placeholder-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Static project checks
        run: npm run check:static

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript
        run: npm run typecheck

      - name: Next.js build
        run: npm run build
